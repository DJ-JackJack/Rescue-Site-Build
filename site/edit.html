<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The edit page runs only its own script and only talks to the site's Supabase project. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src https://yysfgsdwlddeilktumza.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Site editor · TheTerr0rTw!ns</title>
<meta name="theme-color" content="#352262">
<meta name="apple-mobile-web-app-title" content="Site editor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="{{asset:icon.svg}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{asset:apple-touch-icon.png}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="{{asset:site.css}}">
<link rel="stylesheet" href="{{asset:edit.css}}">
<script type="application/json" id="config">{{config}}</script>
<script src="{{asset:edit.js}}" defer></script>
</head>
<body class="editor">
<header class="ebar">
  <div class="wrap ebar-in">
    <a class="brand" href="#/">TheTerr0rTw!ns<small>Site editor</small></a>
    <a class="btn ghost sm" href="{{base}}" target="_blank" rel="noopener">View site <span class="ext" aria-hidden="true">↗</span></a>
    <button class="btn ghost sm" type="button" id="signout" hidden>Sign out</button>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1">
  <noscript><p class="note">The editor needs JavaScript turned on.</p></noscript>
  <p class="note" id="boot">Loading…</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
