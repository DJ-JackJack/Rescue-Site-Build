<!--{"title":"Every Animal I've Helped","description":"The proof wall: every animal tae has helped, and where they are now.","nav":"animals","path":"animals/"}-->
<section class="wallsec" style="padding-top:36px">
  <div class="wrap">
    <p class="eyebrow">The proof wall</p>
    <h1 class="h2">Every animal I've helped.</h1>
    <p class="lede">I follow my animals from their first trip to the end, wherever that is. Tap any animal to see their journey.</p>
    <div class="counts" data-counts></div>
    <div class="filters" id="wall-filters" role="group" aria-label="Show animals by status">
      <button aria-pressed="true" data-f="all">All</button>
      <button aria-pressed="false" data-f="adopted">Adopted</button>
      <button aria-pressed="false" data-f="placed">Placed</button>
      <button aria-pressed="false" data-f="sanctuary">In sanctuary</button>
      <button aria-pressed="false" data-f="looking">Still looking</button>
    </div>
    <p class="sr" id="wall-count" aria-live="polite"></p>
    <ul class="wall" data-wall="all" data-filters="#wall-filters" data-live="#wall-count"></ul>
  </div>
</section>
