# Keeps the Supabase project awake. Free projects pause after about a week with very little database use,
# which would stop the live content and the edit page. Two small reads twice a day are enough.
# Note: GitHub turns off scheduled workflows in a public repo after 60 days without commits; it emails a warning first.
name: Keep database awake
on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/supabase.json
          sparse-checkout-cone-mode: false
      - name: Read a little public data
        run: |
          # the database's address and publishable key (public on purpose: reads published rows only)
          SUPABASE_URL=$(jq -r .url site/supabase.json); SUPABASE_KEY=$(jq -r .key site/supabase.json)
          for t in goals animals; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "apikey: $SUPABASE_KEY" "$SUPABASE_URL/rest/v1/$t?select=id&limit=1" || true)
            echo "$t: $code"
            if [ "$code" = "540" ]; then echo "::error::The Supabase project is paused. Open the Supabase dashboard and choose Resume project."; exit 1; fi
            if [ "$code" != "200" ]; then echo "::error::Unexpected response $code from $t"; exit 1; fi
          done
