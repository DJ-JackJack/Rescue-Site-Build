# Builds site/ and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Launch switch: Settings > Secrets and variables > Actions > Variables, set SITE_PREVIEW to 0
# (unset or 1 = preview: hidden from search engines, with a preview banner).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: node site/build.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_PREVIEW: ${{ vars.SITE_PREVIEW || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
