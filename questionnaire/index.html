<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#36674A">
<title>Website Planning Questionnaire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: single column, sticky progress header, accordion sections, phone-first touch targets. */
:root{
  --bg:#F3F6F0; --surface:#FFFFFF; --sunk:#EDF1E9;
  --fg:#18241C; --muted:#56655A; --line:#D7DFD2;
  --accent:#36674A; --accent-ink:#FFFFFF; --spark:#8FAE1F; --spark-ink:#1B2605;
  --flag:#9A5B16; --flag-bg:#FBF0E2;
  --ok:#2F6B45;
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --gut:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111A14; --surface:#1A241D; --sunk:#151E18;
  --fg:#E7EFE5; --muted:#9BAB9E; --line:#2B3A2F;
  --accent:#7CB592; --accent-ink:#0C1610; --spark:#B6D63A; --spark-ink:#18210A;
  --flag:#E3A765; --flag-bg:#2C2317;
  --ok:#7CC496;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111A14; --surface:#1A241D; --sunk:#151E18;
  --fg:#E7EFE5; --muted:#9BAB9E; --line:#2B3A2F;
  --accent:#7CB592; --accent-ink:#0C1610; --spark:#B6D63A; --spark-ink:#18210A;
  --flag:#E3A765; --flag-bg:#2C2317;
  --ok:#7CC496;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--accent)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}

/* ---- sticky header ---- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--accent);color:var(--accent-ink)}
#bar .in{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
#bar h1{font-size:1rem;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip{font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.17);white-space:nowrap}
#chip.on{background:var(--spark);color:var(--spark-ink)}
#track{height:4px;background:rgba(255,255,255,.22)}
#fill{height:100%;width:0;background:var(--spark);transition:width .3s ease}

/* ---- shell ---- */
.wrap{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;max-width:720px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:18px 56px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero .eyebrow{font-family:var(--f-disp);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--spark);filter:saturate(1.2) brightness(.82)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .eyebrow{filter:none}}
:root[data-theme="dark"] .hero .eyebrow{filter:none}
.hero h2{font-size:1.5rem;font-weight:800;line-height:1.15;margin:6px 0 10px}
.hero p{color:var(--muted);font-size:.95rem}
.hero p + p{margin-top:9px}
.hero b{color:var(--fg)}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.sec[open]{border-color:var(--accent)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 16px;min-height:56px}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:3px solid var(--spark);outline-offset:-3px}
.sn{font-family:var(--f-disp);font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:4px 7px;border-radius:5px;white-space:nowrap}
.st{flex:1;min-width:0;font-family:var(--f-disp);font-weight:700;font-size:1.02rem;line-height:1.25}
.cnt{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt.done{color:var(--ok);font-weight:600}
.caret{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:3px;transition:transform .2s;flex:none}
details[open] .caret{transform:rotate(-135deg)}
.body{padding:0 16px 18px;display:flex;flex-direction:column;gap:20px;border-top:1px solid var(--line)}
.intro{color:var(--muted);font-size:.92rem;padding-top:14px}

.q{display:flex;flex-direction:column;gap:9px}
.qh{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.qn{font-family:var(--f-disp);font-weight:800;color:var(--accent);font-size:.95rem;flex:none}
.qt{font-weight:600;font-size:1rem;line-height:1.35;flex:1;min-width:0}
.help{color:var(--muted);font-size:.86rem;font-style:italic;line-height:1.45}
.tag{font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--flag);background:var(--flag-bg);border:1px solid var(--flag);border-radius:999px;padding:3px 8px;align-self:center}
.sublab{font-weight:600;font-size:.88rem;margin-bottom:5px;display:block}

input[type=text],textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--fg);background:var(--sunk);border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;min-height:46px}
textarea{resize:vertical;line-height:1.5}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--sunk);cursor:pointer;min-height:46px;transition:border-color .15s,background .15s}
.opt:has(input:checked){border-color:var(--accent);background:var(--surface)}
.opt:focus-within{outline:2px solid var(--spark);outline-offset:1px}
.opt input{flex:none;width:21px;height:21px;margin:1px 0 0;accent-color:var(--accent)}
.opt span{font-size:.95rem;line-height:1.35}
.otherwrap{display:flex;flex-direction:column;gap:7px}

.rows{display:flex;flex-direction:column;gap:11px}
.row{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:9px}
.row.filled{border-color:var(--accent);background:var(--surface)}
.rowname{font-family:var(--f-disp);font-weight:700;font-size:.95rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}

.rate{display:flex;flex-direction:column;gap:9px}
.rr{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--sunk)}
.rr.filled{border-color:var(--accent);background:var(--surface)}
.rr .nm{font-family:var(--f-disp);font-weight:700;font-size:.95rem}
.rr .ds{color:var(--muted);font-size:.83rem;line-height:1.4;margin:2px 0 10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:9px 4px;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--surface);min-height:42px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:focus-within{outline:2px solid var(--spark);outline-offset:1px}

.note{background:var(--sunk);border-left:4px solid var(--spark);border-radius:0 10px 10px 0;padding:14px 15px}
.note h3{font-size:.95rem;font-weight:700;margin-bottom:8px}
.note ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.note li{font-size:.9rem;line-height:1.45;color:var(--muted)}
.note li b,.note li strong{color:var(--fg)}
.note.flag{border-left-color:var(--flag);background:var(--flag-bg)}

.btn{border:none;border-radius:10px;padding:14px 18px;font-weight:700;font-size:1rem;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:50px;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn:active{transform:translateY(1px)}
#out{width:100%;min-height:230px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;line-height:1.5}
.fin{display:flex;flex-direction:column;gap:11px}
.saveline{font-size:.83rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header id="bar">
  <div class="in">
    <h1>Website Planning</h1>
    <span id="chip">Loading</span>
  </div>
  <div id="track"><div id="fill"></div></div>
</header>

<div class="wrap"><div class="stack" id="stack"></div></div>

<script>
const SECTIONS = [
{k:"Start here",t:"The Website in Your Own Words",
 intro:"Before our questions get in your head, tell us what you already picture. Write it however it comes out. Rambling is good, half-formed ideas are good, and contradicting yourself later is completely fine. This is the part we will come back to most.",
 items:[
  {q:1,text:"Imagine the website already exists, exactly the way you would want it. Walk us through it. What is on it, what does it feel like, what is it doing for you?",help:"Write as much as you want. There is no length limit.",f:["long",9]},
  {note:"Stuck? Any one of these can get you going",list:["What do you want someone to feel in the first few seconds of landing on it?","What is the one thing you wish more people understood about your work with animals?","What do you find yourself explaining or linking to over and over again?","If the site could only have one page, what would be on it?","Who do you most want to send the link to, and what do you want them to think?","Is there a website, a book cover, a shop, or even a room that has the feeling you want?"]},
  {q:2,text:"Anything you already know you do NOT want?",help:"Pet peeves count. So do things you have seen on other sites that made you cringe or made you leave.",f:["long",4]}
]},

{k:"Part 1",t:"About You and Your Work",
 intro:"Start with the big picture. This helps us understand what the website needs to hold together.",
 items:[
  {q:3,text:"What name should go at the top of the website?",help:"Your personal name, a brand or creator name, or both. If you have a handle you go by online, include it.",f:["short"]},
  {q:4,text:"In one or two sentences, how do you describe what you do?",help:"Pretend someone at a party just asked “So what do you do?” Write it the way you would say it.",f:["long",3]},
  {q:5,text:"Which of these are part of your work right now? Check everything that applies.",f:["checks",["Making social media content (videos, photos, posts)","Paid brand deals or sponsored posts","Volunteering with animal shelters or rescues","Horse or farm animal rescue","Wildlife rehabilitation or conservation","Fostering animals","Fundraising for rescues or causes","Animal photography or video","Art or illustration (like coloring books)","Writing, blogging, or storytelling","Education, talks, or events","Selling products"],1]},
  {q:6,text:"Which ones do you want to grow the most over the next year or two?",help:"Name your top two or three, and a sentence on why.",f:["long",3]},
  {q:7,text:"What is the #1 reason you want a website? Pick the one that matters most.",f:["radios",["Get hired for brand deals and partnerships","Grow my audience and following","Help animals get adopted, fostered, or funded","Sell my products (books, art, merch)","Have one professional home that ties it all together","Look more official and trustworthy"],1]},
  {q:8,text:"A year from now, what would make you say “the website is working”?",help:"For example: brands reach out through it, a certain number of animals get adopted, you sell books every week, people stop asking “where do I find your stuff?”",f:["long",4]}
]},

{k:"Part 2",t:"Who Visits Your Website",
 intro:"A website works best when it knows who it is talking to. Different visitors need different things.",
 items:[
  {q:9,text:"Who do you expect to visit? Check everyone who applies.",f:["checks",["My followers and fans","Brands and sponsors","Shelters and rescues that want to partner","People looking to adopt or foster","Donors and supporters","Reporters, podcasts, or event organizers","People who want to buy my products","Other creators who want to collaborate","Teachers, schools, or kids","Local community members"],1]},
  {q:10,text:"If you could only make the website perfect for ONE of those visitors, who would it be, and why?",f:["long",3]},
  {q:11,text:"What should a visitor DO before they leave your website? Check up to three.",help:"These become the big buttons on your site, so fewer is stronger.",f:["checks",["Follow me on social media","Contact me about working together","Donate to a rescue or cause","Adopt or foster an animal","Buy something","Join my email list","Watch or read my content","Volunteer"],1]}
]},

{k:"Part 3",t:"Your Social Media",
 intro:"Your website will be the hub that connects all of your accounts. Fill in the ones you use and skip the rest.",
 items:[
  {q:12,text:"Your accounts. Fill in the ones you use.",help:"Handle means your @name. Rough follower counts are perfect; exact numbers are not needed.",f:["social"]},
  {q:13,text:"Which platform is your main home, the one you care about most?",f:["short"]},
  {q:14,text:"Should your website show your newest posts automatically?",help:"This is called a feed. It keeps the site fresh without you lifting a finger.",f:["radios",["Yes, show my latest posts on the site","No, just link to my accounts","Not sure, help me decide"],0]},
  {q:15,text:"Do you want a “Work With Me” page for brands?",help:"This is your media kit: a page showing your audience, follower numbers, past partnerships, and how to reach you for paid work.",ex:1,f:["radios",["Yes, as a page anyone can see","Yes, but as a download brands ask me for","Yes, and show my prices","Not right now","Not sure"],0]},
  {q:16,text:"Brands, organizations, or creators you have partnered with that you would be proud to show off.",help:"Include what you made together if you remember. If you already have a media kit or rate sheet, send that along too.",ex:1,f:["long",4]}
]},

{k:"Part 4",t:"Shelters, Rescues, and Wildlife",
 intro:"This is the heart of the hub. Tell us about the organizations and animals you work with, and how the website can help them.",
 items:[
  {q:17,text:"Organizations you work with.",help:"Your role could be volunteer, foster, ambassador, partner, board member, or anything else. Fill in as many as apply.",f:["orgs"]},
  {q:18,text:"How should the website help these organizations and animals? Check all that fit.",f:["checks",["Spotlight animals that need homes","Link to their donation pages","Collect donations right on my site","Share their events and fundraisers","Tell stories of animals I have helped","Show how people can volunteer","Teach people about animal care or wildlife","Before-and-after or rescue journey stories","Wish lists (supplies people can buy and send)","List of partner organizations with logos"],1]},
  {q:19,text:"How often would featured animals or stories change?",help:"This tells us whether the site needs an easy way to add new animals regularly.",f:["radios",["Often (every week or so)","Sometimes (about monthly)","Rarely; mostly lasting stories","Not sure"],0]},
  {q:20,text:"Tell us about one or two animals or rescue stories that mean the most to you.",help:"These often become the emotional center of the website. Send Krys a favorite photo of each.",ex:1,f:["long",6]},
  {q:21,text:"Are there agreements or permissions we should respect?",help:"For example: contracts with a rescue, rules about using an organization's name or logo, who owns photos of certain animals, profit-sharing on products, or anything you need approval for before it goes public.",f:["long",4]},
  {q:22,text:"Anything sensitive about the wildlife or animal work?",help:"For example: keeping rehab or release locations private, license rules about what you can show, or animals that cannot be shown with people.",f:["long",4]}
]},

{k:"Part 5",t:"Things You Sell or Offer",
 intro:"Anything people can buy, book, or hire you for. If nothing is for sale yet, check what you might offer later.",
 items:[
  {q:23,text:"What do you offer, or plan to offer? Check all that apply.",ex:1,f:["checks",["Coloring books","Art prints or originals","Merch (shirts, stickers, mugs)","Digital downloads (printables, guides)","Commissions (custom art or pet portraits)","Sponsored content for brands","Photography or video services","Talks, workshops, or school visits","Nothing for sale yet"],1]},
  {q:24,text:"How should people buy?",f:["radios",["Right on my website","Send them to where it already sells (Amazon, Etsy, etc.)","A mix of both","Not sure yet"],0]},
  {q:25,text:"List anything already for sale somewhere, with links.",help:"Include book titles, shops, and stores. Send cover images or product photos if you have them.",ex:1,f:["long",4]}
]},

{k:"Part 6",t:"Pages and Features",
 intro:"Here is a menu of pages most creator and rescue websites use. Pick one button per row. “Nice to have” is a great answer when you are unsure.",
 items:[
  {q:26,text:"Which pages do you want?",f:["pages"]},
  {q:27,text:"How do you picture the layout?",f:["radios",["One long page you scroll down","Several pages with a menu at the top","Not sure; whatever works best"],0]},
  {q:28,text:"What should people see first on the homepage?",f:["radios",["A big photo or video of me with animals","My newest content","A featured animal or cause","My newest product","A short welcome message","Not sure"],0]},
  {q:29,text:"Which features do you want? Check all that appeal to you.",f:["checks",["Contact form","Email newsletter sign-up","Videos playing right on the site","Live social media feed","Donation button","Online store with checkout","Event calendar","Photo gallery","Kind words from partners or followers","Booking a call or appointment","Search bar","A members-only or supporters area"],1]},
  {q:30,text:"Anything else you picture on the website that we have not asked about?",f:["long",4]}
]},

{k:"Part 7",t:"Look and Feel",
 intro:"This part shapes how the website looks. Pictures help most here, so watch for the orange tags. Trust your gut; “I just like it” is a real answer.",
 items:[
  {q:31,text:"Pick up to three words for how the website should FEEL.",f:["checks",["Warm","Playful","Earthy and natural","Clean and simple","Bold and bright","Elegant","Rustic","Cozy","Professional","Whimsical","Dramatic and moody","Cheerful","Handmade and artsy","Calm and soft","Wild and adventurous","Heartfelt"],1]},
  {q:32,text:"Colors. Do you already have colors you use for your brand?",help:"Look at your social media profile, your book covers, or your logo. Any colors you keep coming back to count.",ex:1,
   f:["radios",["Yes, I have set colors","I have a few favorites","No; help me choose"],0],
   sub:[{id:"q32_love",lab:"Colors you love (describe them, like “sage green” or “barn red”)",t:"long",rows:2},{id:"q32_avoid",lab:"Colors you want to avoid",t:"long",rows:2}]},
  {q:33,text:"Do you have a logo?",ex:1,f:["radios",["Yes (send it to Krys)","I have a rough idea or sketch (send it)","No, but I would like one","No; just use my name in nice lettering"],0]},
  {q:34,text:"Lettering style. Which feels most like you?",f:["radios",["Clean and modern","Classic, like a nice book","Handwritten or brush style","Rounded and friendly","Not sure"],0]},
  {q:35,text:"Websites you like the look of. Up to three.",help:"They do not need to be about animals. You can like just one thing, like the colors, the photos, or how simple it feels. Paste the link and tell us what caught your eye.",ex:1,f:["sites"]},
  {q:36,text:"Websites or styles you do NOT like, and why.",help:"Just as useful as what you like. “Too busy,” “too corporate,” and “hard to find anything” are all great answers.",ex:1,f:["long",4]},
  {q:37,text:"Photos. What do you have of yourself and your animal work?",ex:1,f:["radios",["Lots of good quality photos","A decent amount","Mostly quick phone snapshots","Very few; I would need new ones"],0],
   sub:[{id:"q37_where",lab:"Where are the rest stored? (phone, Google Photos, a photographer, somewhere else)",t:"long",rows:2}]}
]},

{k:"Part 8",t:"Your Story in Your Words",
 intro:"Rough notes are perfect. We can polish the wording later; what matters is that it sounds like you.",
 items:[
  {q:38,text:"Your short bio: two or three sentences about who you are.",help:"If you have a bio on Instagram or TikTok, paste it here and add anything it leaves out.",f:["long",4]},
  {q:39,text:"Your longer story. How did you get into animals, rescue, and social media?",help:"Write as much as you like.",f:["long",10]},
  {q:40,text:"Who should write the words on the website?",f:["radios",["I will write them","I would like help writing them","A mix: I give notes, you help shape them"],0]}
]},

{k:"Part 9",t:"Privacy and Safety",
 intro:"A public website reaches strangers too. These answers help us share your work while keeping you, your home, and the animals safe.",
 items:[
  {q:41,text:"Which contact details are OK to show publicly? Check all that are fine.",f:["checks",["A business email address","A contact form only (no email shown)","A phone number","My general area (city or region)","A business mailing address or P.O. box"],0]},
  {q:42,text:"What should stay OFF the website? Check all that apply.",f:["checks",["My home address or exact town","My full legal name","Family members or my partner","My schedule or where I will be","Exact locations of rescues or wildlife","Photos of my house or property"],1]}
]},

{k:"Part 10",t:"Practical Details",
 intro:"Quick questions about the nuts and bolts. Ballpark answers are perfect; we will look at real options together later.",
 items:[
  {q:43,text:"Do you own a domain name (your web address, like yourname.com)?",f:["radios",["Yes, I own one","No, but I have ideas","No ideas yet","Not sure what I have"],0],
   sub:[{id:"q43_names",lab:"Write the domain you own, or names you would love to have",t:"long",rows:2}]},
  {q:44,text:"Do you have a website or link-in-bio page now?",help:"Linktree, Beacons, a Facebook page, an old blog, an Etsy shop, anything. Paste the links.",f:["long",3]},
  {q:45,text:"After the website is built, who will keep it updated?",f:["radios",["Me","Krys","Both of us","Not sure yet"],0]},
  {q:46,text:"How comfortable are you with tech and apps?",help:"This helps us pick tools that are easy for you to update.",f:["radios",["Very comfortable","Fine once someone shows me","I would rather not touch it"],0]},
  {q:47,text:"What feels OK to spend each month on keeping the website running?",help:"Most websites have small ongoing costs for the web address and hosting. This just helps us aim.",f:["radios",["Free options only for now","Up to about $15 a month","About $15 to $40 a month","More, if it is worth it","Not sure yet"],0]},
  {q:48,text:"When would you like the website live?",f:["radios",["As soon as possible","In the next 1 to 2 months","In the next 3 to 6 months","No rush"],0],
   sub:[{id:"q48_dates",lab:"Any dates to plan around? (a book release, an event, a fundraiser, a busy season)",t:"long",rows:2}]}
]},

{k:"Part 11",t:"Wrapping Up",
 items:[
  {q:49,text:"Anything else we should know? Dreams for the site, worries, wild ideas, anything.",f:["long",6]},
  {q:50,text:"Questions you have for us.",f:["long",4]}
]}
];

const PLATFORMS=["Instagram","TikTok","YouTube","Facebook","X (Twitter)","Threads","Pinterest","Patreon","Other"];
const FREQ=["","Every day","A few times a week","About once a week","Now and then","Not active"];
const FEATOK=["","Yes","No","I need to ask them"];
const PAGES=[["Home","The front porch. A quick hello, your best stuff, and where to go next."],["About Me","Your story, your photo, and why you do this work."],["Rescue and Shelter Work","The organizations you work with and the animals you help."],["Wildlife","Your wildlife rehab, conservation, or education work."],["Content Hub","Your newest videos and posts from every platform in one spot."],["Stories or Blog","Longer posts: rescue stories, updates, behind the scenes."],["Gallery","Photos and videos to browse."],["Shop","Coloring books, prints, merch, or anything you sell."],["Work With Me","For brands: your audience, past partners, and how to hire you."],["Press","Interviews, articles, podcasts, and features about you."],["Support or Donate","Ways to help your causes, including donation links and wish lists."],["Events","Adoption days, fundraisers, appearances, and dates."],["Contact","How people reach you."],["FAQ","Answers to the questions people ask you all the time."]];
const RATE=["Must have","Nice to have","Skip it"];
const KEY="wpq.v1";
/* Answers sync to a Supabase table through one write-only function. The key below is the
   public "publishable" key: it can call save_questionnaire and nothing else. */
const SB_URL="https://yysfgsdwlddeilktumza.supabase.co";
const SB_KEY="sb_publishable_UtnxK1yVdvtQhj9pP608jA_mW9ZL5Ty";

let S={};
let timer=null,dirty=false;
const DEVICE=(()=>{
  const mk=()=>crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
  try{ let d=localStorage.getItem("wpq.device"); if(!d){ d=mk(); localStorage.setItem("wpq.device",d); } return d; }
  catch(e){ return mk(); }
})();

/* ---------- storage ---------- */
function local(write){
  try{ if(write) localStorage.setItem(KEY,JSON.stringify(S));
       else { const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; } }
  catch(e){ return null; }
}
function chip(txt,on){ const c=document.getElementById("chip"); c.textContent=txt; c.classList.toggle("on",!!on); }
function queue(){
  dirty=true; chip("Saving");
  clearTimeout(timer);
  timer=setTimeout(flush,700);
}
async function flush(){
  if(!dirty) return;
  dirty=false;
  local(true);
  if(await send(false)){ chip("Saved",1); return; }
  chip("Saved on this phone",1);
}
function send(keepalive){
  return fetch(SB_URL+"/rest/v1/rpc/save_questionnaire",{
    method:"POST", keepalive,
    headers:{"apikey":SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({p_device:DEVICE,p_answers:S})
  }).then(r=>r.ok,()=>false);
}
addEventListener("pagehide",()=>{ if(dirty){ dirty=false; local(true); send(true); } });
addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&dirty) flush(); });

/* ---------- helpers ---------- */
function el(tag,cls,txt){ const n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
function val(id){ return S[id]==null?"":S[id]; }
function set(id,v){ if(v===""||v==null) delete S[id]; else S[id]=v; queue(); paint(); }

function field(id,kind,rows){
  let n;
  if(kind==="long"){ n=el("textarea"); n.rows=rows||3; }
  else { n=el("input"); n.type="text"; }
  n.id=id; n.value=val(id);
  n.addEventListener("input",()=>{ const v=n.value; if(v==="")delete S[id]; else S[id]=v; queue(); paint(); });
  return n;
}
function selectBox(id,opts){
  const s=el("select"); s.id=id;
  opts.forEach(o=>{ const op=el("option",null,o===""?"Choose one":o); op.value=o; s.appendChild(op); });
  s.value=val(id);
  s.addEventListener("change",()=>set(id,s.value));
  return s;
}

/* ---------- field builders ---------- */
function buildChecks(id,opts,other){
  const box=el("div","opts");
  const cur=Array.isArray(S[id])?S[id]:[];
  opts.forEach((o,i)=>{
    const l=el("label","opt"), c=el("input"); c.type="checkbox"; c.checked=cur.indexOf(o)>-1;
    c.addEventListener("change",()=>{
      const a=Array.isArray(S[id])?S[id].slice():[];
      const k=a.indexOf(o); if(c.checked){ if(k<0)a.push(o); } else if(k>-1)a.splice(k,1);
      if(a.length)S[id]=a; else delete S[id]; queue(); paint();
    });
    l.appendChild(c); l.appendChild(el("span",null,o)); box.appendChild(l);
  });
  if(other){
    const w=el("div","otherwrap"), l=el("label","opt"), c=el("input"); c.type="checkbox";
    c.checked=!!S[id+"_other"]; c.disabled=true; c.style.opacity=.55;
    l.appendChild(c); l.appendChild(el("span",null,"Something else (type it below)"));
    const t=field(id+"_other","short"); t.placeholder="Anything we missed";
    w.appendChild(l); w.appendChild(t); box.appendChild(w);
  }
  return box;
}
function buildRadios(id,opts,other){
  const box=el("div","opts");
  opts.forEach(o=>{
    const l=el("label","opt"), r=el("input"); r.type="radio"; r.name=id; r.checked=val(id)===o;
    r.addEventListener("change",()=>set(id,o));
    l.appendChild(r); l.appendChild(el("span",null,o)); box.appendChild(l);
  });
  if(other){
    const w=el("div","otherwrap"), l=el("label","opt"), r=el("input"); r.type="radio"; r.name=id;
    r.checked=val(id)==="__other"; r.addEventListener("change",()=>set(id,"__other"));
    l.appendChild(r); l.appendChild(el("span",null,"Something else"));
    const t=field(id+"_other","short"); t.placeholder="Tell us in your own words";
    w.appendChild(l); w.appendChild(t); box.appendChild(w);
  }
  return box;
}
function buildSocial(){
  const box=el("div","rows");
  PLATFORMS.forEach(p=>{
    const k="q12_"+p.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
    const r=el("div","row");
    if(p==="Other"){ const t=field(k+"_name","short"); t.placeholder="Another platform"; r.appendChild(t); }
    else r.appendChild(el("div","rowname",p));
    const h=field(k+"_handle","short"); h.placeholder="@handle or link";
    const g=el("div","grid2"), f=field(k+"_followers","short"); f.placeholder="About how many followers";
    g.appendChild(f); g.appendChild(selectBox(k+"_freq",FREQ));
    r.appendChild(h); r.appendChild(g);
    r.dataset.keys=k; box.appendChild(r);
  });
  return box;
}
function buildOrgs(){
  const box=el("div","rows");
  for(let i=1;i<=6;i++){
    const k="q17_org"+i, r=el("div","row");
    const n=field(k+"_name","short"); n.placeholder="Organization "+i+" name";
    const li=field(k+"_link","short"); li.placeholder="Their website or social link";
    const g=el("div","grid2"), ro=field(k+"_role","short"); ro.placeholder="Your role there";
    const s=selectBox(k+"_ok",FEATOK); s.setAttribute("aria-label","OK to feature on your site");
    g.appendChild(ro); g.appendChild(s);
    const lab=el("span","help","OK to feature them on your site? Pick in the box on the right.");
    r.appendChild(n); r.appendChild(li); r.appendChild(g); r.appendChild(lab);
    r.dataset.keys=k; box.appendChild(r);
  }
  return box;
}
function buildPages(){
  const box=el("div","rate");
  PAGES.forEach(([nm,ds])=>{
    const id="q26_"+nm.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
    const r=el("div","rr");
    r.appendChild(el("div","nm",nm)); r.appendChild(el("div","ds",ds));
    const seg=el("div","seg");
    RATE.forEach(c=>{
      const l=el("label"), i=el("input"); i.type="radio"; i.name=id; i.checked=val(id)===c;
      i.addEventListener("change",()=>set(id,c));
      l.appendChild(i); l.appendChild(el("span",null,c)); seg.appendChild(l);
    });
    r.appendChild(seg); r.dataset.keys=id; box.appendChild(r);
  });
  const o=el("div","rr"), t=field("q26_other_name","short"); t.placeholder="Another page you want";
  o.appendChild(t); box.appendChild(o);
  return box;
}
function buildSites(){
  const box=el("div","rows");
  for(let i=1;i<=3;i++){
    const k="q35_site"+i, r=el("div","row");
    r.appendChild(el("div","rowname","Website "+i));
    const li=field(k+"_link","short"); li.placeholder="Paste the link";
    const w=field(k+"_why","long",3); w.placeholder="What you like about it";
    r.appendChild(li); r.appendChild(w); r.dataset.keys=k; box.appendChild(r);
  }
  return box;
}

/* ---------- render ---------- */
function answered(q){
  const items=[];
  for(const k in S){ if(k===("q"+q)||k.indexOf("q"+q+"_")===0) items.push(k); }
  return items.length>0;
}
function render(){
  const stack=document.getElementById("stack");

  const hero=el("div","hero");
  hero.appendChild(el("div","eyebrow","Let's plan your website"));
  hero.appendChild(el("h2","","One home for your social media, your shelter and rescue work, and your wildlife work."));
  const p1=el("p"); p1.innerHTML="This is just the two of us figuring out your website together. Nobody else sees this. Your answers tell us what goes on the site, who it is for, and how it should look and feel, and then we turn that into a <b>mockup</b> (a picture of the finished website) for you to react to before anything gets built or paid for.";
  const p2=el("p"); p2.innerHTML="There are no wrong answers, and you do not need to know anything about web design. <b>“Not sure” is always a fine answer</b>, and so is skipping anything that does not fit. <b>Everything saves by itself as you type</b>, so close this whenever you want and come back to it later on the same phone. Krys can see your answers as they save, so you do not need to send anything.";
  const p3=el("p"); p3.innerHTML="Tap a section to open it. When the bar at the top says <b>Saved</b>, Krys has your latest answers.";
  hero.appendChild(p1); hero.appendChild(p2); hero.appendChild(p3);
  stack.appendChild(hero);

  const flag=el("div","note flag");
  flag.appendChild(el("h3","","Photos and screenshots"));
  const ul=el("ul");
  ["Some questions have an orange <b>pictures help</b> tag. Those are the ones where showing beats telling.","Text or AirDrop those photos straight to Krys as you go: screenshots of sites you like, your logo, colors you love, favorite animal photos.","Say which question each one goes with, like <b>“this is for Q20”</b>. That is all we need to match them up.","For videos, send the link to where it already lives instead of the file."].forEach(x=>{const li=el("li");li.innerHTML=x;ul.appendChild(li);});
  flag.appendChild(ul); stack.appendChild(flag);

  SECTIONS.forEach((sec,si)=>{
    const d=el("details","sec"); d.id="sec"+si; if(si===0)d.open=true;
    const sum=el("summary");
    sum.appendChild(el("span","sn",sec.k));
    sum.appendChild(el("span","st",sec.t));
    const cnt=el("span","cnt"); cnt.dataset.sec=si; sum.appendChild(cnt);
    sum.appendChild(el("span","caret"));
    d.appendChild(sum);

    const body=el("div","body");
    if(sec.intro) body.appendChild(el("p","intro",sec.intro));

    sec.items.forEach(it=>{
      if(it.note){
        const n=el("div","note"); n.appendChild(el("h3","",it.note));
        const u=el("ul"); it.list.forEach(x=>u.appendChild(el("li",null,x))); n.appendChild(u);
        body.appendChild(n); return;
      }
      const q=el("div","q"); q.dataset.q=it.q;
      const h=el("div","qh");
      h.appendChild(el("span","qn","Q"+it.q+"."));
      h.appendChild(el("span","qt",it.text));
      if(it.ex) h.appendChild(el("span","tag","pictures help"));
      q.appendChild(h);
      if(it.help) q.appendChild(el("p","help",it.help));

      const id="q"+it.q, kind=it.f[0];
      if(kind==="short"||kind==="long") q.appendChild(field(id,kind,it.f[1]));
      else if(kind==="checks") q.appendChild(buildChecks(id,it.f[1],it.f[2]));
      else if(kind==="radios") q.appendChild(buildRadios(id,it.f[1],it.f[2]));
      else if(kind==="social") q.appendChild(buildSocial());
      else if(kind==="orgs") q.appendChild(buildOrgs());
      else if(kind==="pages") q.appendChild(buildPages());
      else if(kind==="sites") q.appendChild(buildSites());

      (it.sub||[]).forEach(s=>{
        const w=el("div");
        const l=el("label","sublab",s.lab); l.setAttribute("for",s.id);
        w.appendChild(l); w.appendChild(field(s.id,s.t,s.rows));
        q.appendChild(w);
      });
      body.appendChild(q);
    });
    d.appendChild(body); stack.appendChild(d);
  });

  const fin=el("div","fin");
  const h=el("h2"); h.style.fontSize="1.25rem"; h.textContent="Want a copy for yourself?";
  const p=el("p","help","Your answers already reach Krys on their own. If the bar at the top ever says “Saved on this phone” instead of “Saved”, tap this button and paste the copy into a text to Krys so nothing gets lost.");
  const b1=el("button","btn"); b1.textContent="Copy all my answers";
  const ta=el("textarea"); ta.id="out"; ta.readOnly=true; ta.hidden=true;
  const msg=el("p","saveline"); msg.id="copymsg";
  b1.addEventListener("click",async()=>{
    const txt=transcript(); ta.value=txt; ta.hidden=false;
    try{ await navigator.clipboard.writeText(txt); msg.textContent="Copied. Paste it into a message to Krys."; }
    catch(e){ ta.focus(); ta.select(); msg.textContent="Tap and hold the text above, then Select All and Copy."; }
  });
  fin.appendChild(h); fin.appendChild(p); fin.appendChild(b1); fin.appendChild(msg); fin.appendChild(ta);
  stack.appendChild(fin);
}

function labelFor(q){
  for(const s of SECTIONS) for(const i of s.items) if(i.q===q) return i.text;
  return "";
}
function transcript(){
  let o=["WEBSITE PLANNING QUESTIONNAIRE","Answers so far, "+new Date().toLocaleString(),""];
  SECTIONS.forEach(sec=>{
    o.push("");o.push("=== "+sec.k.toUpperCase()+": "+sec.t+" ===");
    sec.items.forEach(it=>{
      if(it.note) return;
      const id="q"+it.q; o.push(""); o.push("Q"+it.q+". "+it.text);
      const kind=it.f[0];
      if(kind==="short"||kind==="long"){ o.push(val(id)||"(skipped)"); }
      else if(kind==="checks"){
        const a=(Array.isArray(S[id])?S[id]:[]).slice();
        if(S[id+"_other"]) a.push("Other: "+S[id+"_other"]);
        o.push(a.length?a.map(x=>"  - "+x).join("\n"):"(skipped)");
      }
      else if(kind==="radios"){
        let v=val(id); if(v==="__other") v="Other: "+(val(id+"_other")||"");
        o.push(v||"(skipped)");
      }
      else if(kind==="social"){
        let any=0;
        PLATFORMS.forEach(p=>{
          const k="q12_"+p.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
          const nm=p==="Other"?(val(k+"_name")||"Other"):p;
          const h=val(k+"_handle"),f=val(k+"_followers"),fr=val(k+"_freq");
          if(h||f||fr){ any=1; o.push("  "+nm+": "+(h||"-")+" | "+(f||"-")+" followers | "+(fr||"-")); }
        });
        if(!any)o.push("(skipped)");
      }
      else if(kind==="orgs"){
        let any=0;
        for(let i=1;i<=6;i++){ const k="q17_org"+i;
          const n=val(k+"_name"),l=val(k+"_link"),r=val(k+"_role"),ok=val(k+"_ok");
          if(n||l||r||ok){ any=1; o.push("  "+(n||"(no name)")+" | "+(l||"-")+" | role: "+(r||"-")+" | feature OK: "+(ok||"-")); } }
        if(!any)o.push("(skipped)");
      }
      else if(kind==="pages"){
        let any=0;
        PAGES.forEach(([nm])=>{ const k="q26_"+nm.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
          if(val(k)){ any=1; o.push("  "+nm+": "+val(k)); } });
        if(val("q26_other_name")){ any=1; o.push("  Other page: "+val("q26_other_name")); }
        if(!any)o.push("(skipped)");
      }
      else if(kind==="sites"){
        let any=0;
        for(let i=1;i<=3;i++){ const k="q35_site"+i;
          if(val(k+"_link")||val(k+"_why")){ any=1; o.push("  "+(val(k+"_link")||"(no link)")+" :: "+(val(k+"_why")||"")); } }
        if(!any)o.push("(skipped)");
      }
      (it.sub||[]).forEach(s=>{ o.push("  "+s.lab+": "+(val(s.id)||"(skipped)")); });
    });
  });
  return o.join("\n");
}

function paint(){
  let done=0;
  SECTIONS.forEach((sec,si)=>{
    const qs=sec.items.filter(i=>i.q);
    const n=qs.filter(i=>answered(i.q)).length;
    done+=n;
    const c=document.querySelector('.cnt[data-sec="'+si+'"]');
    if(c){ c.textContent=n+"/"+qs.length; c.classList.toggle("done",n===qs.length); }
  });
  document.getElementById("fill").style.width=Math.round(done/50*100)+"%";
  document.querySelectorAll("[data-keys]").forEach(r=>{
    const k=r.dataset.keys;
    let on=false; for(const key in S){ if(key.indexOf(k)===0){on=true;break;} }
    r.classList.toggle("filled",on);
  });
}

/* ---------- boot ---------- */
const cached=local(false);
if(cached&&typeof cached==="object") S=cached;
render(); paint();
chip(Object.keys(S).length?"Saved on this phone":"Ready",Object.keys(S).length>0);

// Push whatever is on this phone once at load, so answers from before the database existed sync too.
if(Object.keys(S).length) send(false).then(ok=>chip(ok?"Saved":"Saved on this phone",1));
</script>
</body>
</html>
